<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地流水表格</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #1f2937; background: transparent; }
    .grid { overflow: visible; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
    .time-input { width: 100%; height: 36px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #1f2937; font: inherit; }
    .time-input:focus { border-color: #60a5fa; outline: 0; box-shadow: 0 0 0 1px #60a5fa; }
    .toolbar { display: flex; justify-content: flex-start; gap: 8px; padding: 8px 0; background: transparent; }
    .grid .toolbar { justify-content: flex-end; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; background: #f8fafc; }
    button { height: 34px; padding: 0 14px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #374151; cursor: pointer; font: inherit; }
    button:hover:not(:disabled) { background: #f3f4f6; }
    button:disabled { color: #9ca3af; background: #f9fafb; cursor: not-allowed; }
    button.primary { color: #fff; border-color: #2563eb; background: #2563eb; }
    button.danger { color: #b91c1c; border-color: #fecaca; background: #fff1f2; }
    .grid.view .table-wrap { height: calc(var(--grid-height) - 52px); overflow: auto; }
    .grid.edit .table-wrap { height: calc(var(--grid-height) - 52px); overflow: auto; }
    table { border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: max-content; font-size: 13px; }
    th { position: sticky; top: 0; z-index: 2; height: 38px; background: #f8fafc; color: #374151; text-align: left; white-space: nowrap; font-weight: 600; user-select: none; }
    th, td { overflow: hidden; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
    th:last-child, td:last-child { border-right: 0; }
    tr:last-child td { border-bottom: 0; }
    th .header-label { display: block; overflow: hidden; padding: 10px 8px; text-overflow: ellipsis; cursor: grab; }
    th.dragging .header-label { opacity: .45; } th.drag-over { box-shadow: inset 3px 0 #2563eb; }
    .resize { position: absolute; top: 0; right: -3px; z-index: 3; width: 7px; height: 100%; cursor: col-resize; }
    .resize:hover, .resizing .resize { background: #93c5fd; }
    td { height: 36px; padding: 0; white-space: nowrap; text-overflow: ellipsis; }
    td .cell-text { display: block; overflow: hidden; padding: 9px 8px; text-overflow: ellipsis; }
    td.focused { outline: 2px solid #2563eb; outline-offset: -2px; position: relative; z-index: 1; }
    td.range { background: #eff6ff !important; }
    tr.pending td { background: #fff1f2; } tr.settled td { background: #ecfdf5; }
    .select { width: 54px; text-align: center; } .select input { width: 16px; height: 16px; cursor: pointer; }
    .grid.yearly-summary .table-wrap { overflow-x: hidden; }
    .grid.yearly-summary table { width: 100%; min-width: 100%; font-size: 12px; }
    .grid.yearly-summary th { height: 32px; }
    .grid.yearly-summary th .header-label { padding: 7px 4px; }
    .grid.yearly-summary td .cell-text { padding: 7px 4px; }
    .grid.yearly-summary td.summary-first .cell-text { font-weight: 600; }
    th.summary-first { left: 0; z-index: 4; box-shadow: 1px 0 0 #e5e7eb; }
    td.summary-first { position: sticky; left: 0; z-index: 1; background: #fff; box-shadow: 1px 0 0 #e5e7eb; }
    input, select { width: 100%; min-width: 0; height: 35px; padding: 6px 8px; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; }
    input:focus, select:focus { background: #eff6ff; box-shadow: inset 0 0 0 2px #60a5fa; }
    input[type=number] { text-align: right; } select:disabled { color: #9ca3af; background: #f9fafb; cursor: not-allowed; }
    .amount-input { appearance: textfield; -moz-appearance: textfield; }
    .amount-input::-webkit-inner-spin-button, .amount-input::-webkit-outer-spin-button { margin: 0; -webkit-appearance: none; }
    .reorder-controls { display: flex; justify-content: center; gap: 4px; padding: 0 5px; }
    .reorder-controls button { width: 28px; height: 28px; padding: 0; border-radius: 4px; font-size: 13px; }
    .batch-modal-backdrop { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(15, 23, 42, .42); }
    .batch-modal { width: min(460px, 100%); max-height: calc(100vh - 36px); overflow: auto; padding: 20px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; box-shadow: 0 18px 48px rgba(15, 23, 42, .22); color: #111827; }
    .batch-modal h3 { margin: 0 0 16px; font-size: 18px; }
    .batch-field { display: grid; gap: 6px; margin: 0 0 12px; }
    .batch-field label { color: #374151; font-size: 13px; font-weight: 600; }
    .batch-field select { height: 36px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; }
    .batch-field select:disabled { background: #f3f4f6; color: #9ca3af; }
    .batch-hint { margin: 0 0 14px; color: #6b7280; font-size: 12px; }
    .batch-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .manual-modal-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(15, 23, 42, .42); }
    .manual-modal { width: min(900px, 100%); max-height: calc(100vh - 36px); overflow: auto; padding: 20px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; box-shadow: 0 18px 48px rgba(15, 23, 42, .22); color: #111827; }
    .manual-modal h3 { margin: 0 0 16px; font-size: 18px; }
    .manual-form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }
    .manual-field { display: grid; gap: 6px; min-width: 0; }
    .manual-field.full { grid-column: 1 / -1; }
    .manual-field label { color: #374151; font-size: 13px; font-weight: 600; }
    .manual-field input, .manual-field select { height: 36px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; }
    .manual-field input:focus, .manual-field select:focus { border-color: #60a5fa; background: #fff; box-shadow: 0 0 0 1px #60a5fa; }
    .manual-error { margin: 12px 0 0; color: #b91c1c; font-size: 13px; }
    .manual-modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
    .manual-modal-actions button { width: 100%; }
    @media (max-width: 720px) { .manual-form-grid { grid-template-columns: 1fr; } .manual-field.full { grid-column: auto; } }
    .confirm-modal-backdrop { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(15, 23, 42, .42); }
    .confirm-modal { width: min(420px, 100%); padding: 18px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; box-shadow: 0 18px 48px rgba(15, 23, 42, .22); color: #111827; }
    .confirm-modal p { margin: 0; line-height: 1.55; font-size: 14px; }
    .confirm-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .empty { padding: 22px; color: #6b7280; text-align: center; }
    th.filterable .header-label { padding-right: 42px; }
    .filter-trigger { position: absolute; top: 5px; right: 7px; width: 27px; height: 27px; padding: 0; border: 0; border-radius: 4px; color: #64748b; background: transparent; font-size: 15px; line-height: 1; }
    .filter-trigger:hover, .filter-trigger.active { color: #1d4ed8; background: #dbeafe; }
    .filter-popover { position: fixed; z-index: 30; width: min(300px, calc(100vw - 24px)); max-height: min(420px, calc(100vh - 24px)); overflow: auto; padding: 12px; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; box-shadow: 0 14px 32px rgba(15, 23, 42, .2); }
    .filter-popover h4 { margin: 0 0 8px; font-size: 14px; }
    .filter-options { display: grid; gap: 5px; max-height: 250px; overflow: auto; margin: 6px 0 10px; }
    .filter-option { display: flex; align-items: center; gap: 7px; min-height: 28px; font-size: 13px; }
    .filter-option input { width: 16px; height: 16px; }
    .filter-range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 10px; }
    .filter-range input { height: 32px; padding: 5px 7px; border: 1px solid #cbd5e1; border-radius: 4px; }
    .filter-error { margin: 0 0 8px; color: #b91c1c; font-size: 12px; }
    .filter-actions { display: flex; justify-content: flex-end; gap: 7px; }
    .filter-actions button { height: 30px; padding: 0 9px; font-size: 12px; }
    .grid-count { height: 30px; padding: 7px 9px 5px; color: #6b7280; background: #fff; font-size: 12px; text-align: left; }
    .sort-section { display: grid; gap: 6px; margin: 8px 0 10px; padding-top: 8px; border-top: 1px solid #e5e7eb; }
    .sort-section button { height: 30px; padding: 0 9px; font-size: 12px; text-align: left; }
    .sort-section button.active { color: #1d4ed8; border-color: #93c5fd; background: #eff6ff; }
  </style>
</head>
<body>
  <div id="grid" class="grid"><div class="empty">正在加载流水…</div></div>
  <script>
    const LAYOUT_KEY = "account_book_transaction_grid_layout_v1";
    const SUMMARY_LAYOUT_KEY_PREFIX = "account_book_yearly_category_grid_layout_v3_";
    const DATE_MODE_KEY = "account_book_transaction_grid_date_mode_v1";
    const BASE_COLUMNS = [
      { key: "时间", width: 170, kind: "datetime-text" }, { key: "账户", width: 90, kind: "select" },
      { key: "收支", width: 85, kind: "select" }, { key: "金额", width: 95, kind: "number" },
      { key: "分类", width: 120, kind: "select" }, { key: "标签", width: 110, kind: "select" }, { key: "报销状态", width: 105, kind: "select" },
      { key: "备注", width: 170, kind: "text" }, { key: "对方", width: 120, kind: "text" },
      { key: "支付方式", width: 120, kind: "text" },
    ];
    const DRAFT_KEY_PREFIX = "account_book_transaction_editor_draft_v2";
    const OPTION_DRAFT_KEY_PREFIX = "account_book_option_editor_draft_v1";
    const state = { version: null, rows: [], draftRows: new Map(), draftSessionId: "", optionDraftId: "", optionDirty: false, optionDirtyReported: false, lastOptionSubmitToken: "", args: {}, mode: "view", selected: new Set(), deletedIds: new Set(), selectionKey: "", active: null, anchor: null, range: null, layout: null, layoutSignature: null, dateMode: null, confirmingReset: false, confirmingDelete: false, confirmingCancel: false, confirmingOptionSave: false, batchEditing: false, manualEntryOpen: false, manualEntryRow: null, manualEntryError: "", dragKey: null, openFilter: null, localFilters: null, filterResetKey: null, filterDraft: null, filterError: "", sortKey: null, sortDirection: null };
    const message = (type, data = {}) => window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    const setValue = value => message("streamlit:setComponentValue", { value });
    const setHeight = () => {
      const grid = document.getElementById("grid");
      // 只回传表格自身高度，避免宿主 iframe 的既有高度被再次当作内容高度而不断留白。
      const height = Math.max(1, Math.ceil(grid?.getBoundingClientRect().height || 0));
      message("streamlit:setFrameHeight", { height });
    };
    const esc = value => String(value ?? "").replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    const dateForInput = value => String(value ?? "").replace("T", " ").slice(0, 19);
    const dateForStore = value => {
      const text = String(value ?? "").trim().replace("T", " ");
      return text.length === 16 ? `${text}:00` : text;
    };
    const DATETIME_SEGMENTS = [[0, 4], [5, 7], [8, 10], [11, 13], [14, 16], [17, 19]];
    const TIME_SEGMENTS = [[0, 2], [3, 5], [6, 8]];
    const segmentAtCursor = (input, segments) => {
      const cursor = input.selectionStart ?? 0;
      const containing = segments.findIndex(([start, end]) => cursor >= start && cursor < end);
      if (containing >= 0) return containing;
      const following = segments.findIndex(([start]) => cursor < start);
      return following >= 0 ? following : segments.length - 1;
    };
    const selectSegment = (input, segments, index) => {
      const [start, end] = segments[index];
      input.focus({ preventScroll: true });
      input.setSelectionRange(start, end);
      input._segmentState = { index, buffer: "", selected: true };
    };
    const selectDateSegment = input => selectSegment(input, DATETIME_SEGMENTS, segmentAtCursor(input, DATETIME_SEGMENTS));
    const selectTimeSegment = input => selectSegment(input, TIME_SEGMENTS, segmentAtCursor(input, TIME_SEGMENTS));
    const segmentParts = (input, segments) => {
      const value = String(input.value || "");
      return segments.map(([start, end]) => value.slice(start, end).replace(/\D/g, ""));
    };
    const writeSegment = (input, segments, index, text) => {
      const parts = segmentParts(input, segments);
      const width = segments[index][1] - segments[index][0];
      parts[index] = String(text || "").slice(0, width);
      const separators = segments.length === DATETIME_SEGMENTS.length
        ? ["-", "-", " ", ":", ":", ""] : [":", ":", ""];
      input.value = parts.map((part, i) => part.padEnd(segments[i][1] - segments[i][0], " ") + separators[i]).join("");
    };
    const emitInput = input => input.dispatchEvent(new Event("input", { bubbles: true }));
    const finishSegment = (input, segments, index) => {
      const state = input._segmentState || { index, buffer: "", selected: false };
      const width = segments[index][1] - segments[index][0];
      const current = state.buffer || segmentParts(input, segments)[index];
      if (current && current.length < width) writeSegment(input, segments, index, current.padStart(width, "0"));
      input._segmentState = { index, buffer: "", selected: false };
    };
    const bindSegmentedInput = (input, segments, onBlur) => {
      input._segmentState = { index: 0, buffer: "", selected: false };
      input.addEventListener("mouseup", event => {
        event.preventDefault();
        const index = segmentAtCursor(input, segments);
        const previous = input._segmentState;
        if (previous?.buffer && previous.index !== index) {
          finishSegment(input, segments, previous.index);
          emitInput(input);
        }
        selectSegment(input, segments, index);
      });
      input.addEventListener("beforeinput", event => {
        const state = input._segmentState || { index: segmentAtCursor(input, segments), buffer: "", selected: false };
        const index = Math.max(0, Math.min(segments.length - 1, state.index));
        const width = segments[index][1] - segments[index][0];
        if (event.inputType === "insertText" && /^[0-9]+$/.test(event.data || "")) {
          event.preventDefault();
          const digits = String(event.data);
          const buffer = state.selected ? "" : (state.buffer || "");
          const next = (buffer + digits).slice(0, width);
          writeSegment(input, segments, index, next);
          input._segmentState = { index, buffer: next, selected: false };
          emitInput(input);
          if (next.length >= width) {
            finishSegment(input, segments, index);
            const nextIndex = Math.min(segments.length - 1, index + 1);
            selectSegment(input, segments, nextIndex);
          } else {
            const [start] = segments[index];
            input.setSelectionRange(start + next.length, start + next.length);
          }
          return;
        }
        if (event.inputType === "insertFromPaste") {
          event.preventDefault();
          const digits = String(event.data || "").replace(/\D/g, "");
          let cursor = index;
          let offset = 0;
          while (cursor < segments.length && offset < digits.length) {
            const widthAtCursor = segments[cursor][1] - segments[cursor][0];
            const part = digits.slice(offset, offset + widthAtCursor);
            writeSegment(input, segments, cursor, part);
            offset += part.length;
            if (part.length === widthAtCursor) cursor += 1; else break;
          }
          emitInput(input);
          const selectedIndex = Math.min(segments.length - 1, cursor);
          selectSegment(input, segments, selectedIndex);
          return;
        }
        if (event.inputType === "deleteContentBackward" || event.inputType === "deleteContentForward") {
          event.preventDefault();
          writeSegment(input, segments, index, "");
          input._segmentState = { index, buffer: "", selected: false };
          emitInput(input);
          const [start] = segments[index];
          input.setSelectionRange(start, start);
        }
      });
      input.addEventListener("paste", event => {
        const digits = String(event.clipboardData?.getData("text") || "").replace(/\D/g, "");
        if (!digits) return;
        event.preventDefault();
        event.stopPropagation();
        const state = input._segmentState || { index: segmentAtCursor(input, segments) };
        let cursor = Math.max(0, Math.min(segments.length - 1, state.index));
        let offset = 0;
        while (cursor < segments.length && offset < digits.length) {
          const width = segments[cursor][1] - segments[cursor][0];
          const part = digits.slice(offset, offset + width);
          writeSegment(input, segments, cursor, part);
          offset += part.length;
          if (part.length === width) cursor += 1; else break;
        }
        emitInput(input);
        selectSegment(input, segments, Math.min(segments.length - 1, cursor));
      });
      input.addEventListener("blur", () => {
        const state = input._segmentState || { index: 0 };
        finishSegment(input, segments, state.index);
        emitInput(input);
        if (onBlur) onBlur(input);
      });
    };
    const displayTime = value => {
      const text = String(value ?? "").replace("T", " ");
      return state.dateMode === "date" ? text.slice(0, 10) : text.slice(0, 19);
    };
    const baseColumns = () => ["yearly-summary", "generic-view", "option-edit"].includes(state.mode)
      ? (state.args.columns || []) : BASE_COLUMNS;
    const currentLayoutKey = () => state.args.layout_key || (state.mode === "yearly-summary"
      ? `${SUMMARY_LAYOUT_KEY_PREFIX}${state.args.year || "default"}_v1` : LAYOUT_KEY);
    const summaryFirstKey = () => state.args.summary_first_key || "";
    const layoutSignature = () => `${currentLayoutKey()}:${baseColumns().map(col => col.key).join("|")}`;
    const defaults = () => ({ order: baseColumns().map(col => col.key), widths: Object.fromEntries(baseColumns().map(col => [col.key, col.width || 100])) });
    const loadLayout = () => {
      try {
        const stored = JSON.parse(localStorage.getItem(currentLayoutKey()));
        const valid = new Set(baseColumns().map(col => col.key));
        if (!stored || !Array.isArray(stored.order) || stored.order.length !== valid.size || stored.order.some(key => !valid.has(key))) return defaults();
        return { order: stored.order, widths: { ...defaults().widths, ...(stored.widths || {}) } };
      } catch (_) { return defaults(); }
    };
    const saveLayout = () => localStorage.setItem(currentLayoutKey(), JSON.stringify(state.layout));
    const loadDateMode = () => localStorage.getItem(DATE_MODE_KEY) === "date" ? "date" : "datetime";
    const saveDateMode = () => localStorage.setItem(DATE_MODE_KEY, state.dateMode);
    const readSelection = () => {
      try { return new Set(JSON.parse(localStorage.getItem(state.selectionKey) || "[]")); }
      catch (_) { return new Set(); }
    };
    const persistSelection = () => localStorage.setItem(state.selectionKey, JSON.stringify([...state.selected]));
    const draftStorageKey = (sessionId = state.draftSessionId) =>
      sessionId ? `${DRAFT_KEY_PREFIX}:${sessionId}` : "";
    const loadDraftState = sessionId => {
      try {
        const key = draftStorageKey(sessionId);
        const stored = key ? JSON.parse(localStorage.getItem(key) || "{}") : {};
        const rows = Array.isArray(stored.rows) ? stored.rows : [];
        const deletedIds = Array.isArray(stored.deleted_ids) ? stored.deleted_ids : [];
        return {
          rows: new Map(rows.map(row => [String(row["记录ID"]), row])),
          deletedIds: new Set(deletedIds.map(String)),
        };
      } catch (_) { return { rows: new Map(), deletedIds: new Set() }; }
    };
    const saveDraftState = () => {
      const key = draftStorageKey();
      if (state.mode === "edit" && key) {
        localStorage.setItem(key, JSON.stringify({
          rows: [...state.draftRows.values()],
          deleted_ids: [...state.deletedIds],
        }));
      }
    };
    const clearDraftState = sessionId => {
      const key = draftStorageKey(sessionId);
      if (key) localStorage.removeItem(key);
    };
    const optionDraftStorageKey = (draftId = state.optionDraftId) => draftId ? `${OPTION_DRAFT_KEY_PREFIX}:${draftId}` : "";
    const loadOptionDraft = draftId => {
      try {
        const key = optionDraftStorageKey(draftId);
        const stored = key ? JSON.parse(localStorage.getItem(key) || "{}") : {};
        return { rows: Array.isArray(stored.rows) ? stored.rows : [], dirty: Boolean(stored.dirty) };
      } catch (_) { return { rows: [], dirty: false }; }
    };
    const saveOptionDraft = () => {
      const key = optionDraftStorageKey();
      if (state.mode === "option-edit" && key) {
        localStorage.setItem(key, JSON.stringify({ rows: state.rows, dirty: state.optionDirty }));
      }
    };
    const clearOptionDraft = draftId => {
      const key = optionDraftStorageKey(draftId);
      if (key) localStorage.removeItem(key);
    };
    const markOptionDirty = () => {
      if (state.mode !== "option-edit") return;
      const wasDirty = state.optionDirty;
      state.optionDirty = true;
      saveOptionDraft();
      if (!wasDirty && !state.optionDirtyReported) {
        state.optionDirtyReported = true;
        setValue({ action: "option_dirty" });
      }
    };
    const syncDraftRows = () => {
      if (state.mode !== "edit") return;
      state.rows.forEach(row => state.draftRows.set(String(row["记录ID"]), JSON.parse(JSON.stringify(row))));
      saveDraftState();
    };
    const sortRows = rows => {
      if (!state.sortKey || !state.sortDirection) return rows;
      const direction = state.sortDirection === "desc" ? -1 : 1;
      return rows.map((row, index) => ({ row, index })).sort((left, right) => {
        let comparison;
        if (state.sortKey === "金额") {
          comparison = (Number(left.row["金额"]) || 0) - (Number(right.row["金额"]) || 0);
        } else {
          comparison = String(left.row["时间"] ?? "").localeCompare(String(right.row["时间"] ?? ""), "zh-CN");
        }
        return comparison === 0 ? left.index - right.index : comparison * direction;
      }).map(item => item.row);
    };
    const filterDraftRows = rows => {
      const filters = state.localFilters || cloneFilters(state.args.filters || {});
      const visibleMonth = String(state.args.visible_month || "");
      const viewMode = String(state.args.view_mode || "month");
      const visibleIds = new Set((state.args.visible_ids || []).map(String));
      const searchKeyword = String(state.args.search_keyword || "").trim();
      const keywordGroups = searchKeyword
        ? searchKeyword.split(/\s+OR\s+|或/i).filter(Boolean).map(group => group.split(/\s+AND\s+|且/i).map(term => term.trim().toLocaleLowerCase()).filter(Boolean))
        : [];
      const matchesKeyword = row => !keywordGroups.length || keywordGroups.some(terms => terms.every(term =>
        [row["备注"], row["分类"], row["对方"]].some(value => String(value || "").toLocaleLowerCase().includes(term))
      ));
      const accounts = new Set(filters.accounts || []);
      const tradeTypes = new Set(filters.trade_types || []);
      const categories = new Set(filters.categories || []);
      const lifeTags = new Set(filters.life_tags || []);

        state.active = null; state.anchor = null; state.range = null;
        syncDraftRows();
        render();
      });
      document.getElementById("delete-selected-draft")?.addEventListener("click", () => { state.confirmingDelete = true; render(); });
      document.getElementById("confirm-delete-draft")?.addEventListener("click", () => {
        state.selected.forEach(transactionId => { state.deletedIds.add(transactionId); state.draftRows.delete(transactionId); });
        state.rows = state.rows.filter(row => !state.selected.has(String(row["记录ID"])));
        state.selected = new Set(); state.active = null; state.anchor = null; state.range = null;
        state.confirmingDelete = false; state.batchEditing = false; state.batchValues = null;
        render();
      });
      document.getElementById("cancel-delete-draft")?.addEventListener("click", () => { state.confirmingDelete = false; render(); });
      document.getElementById("select-all")?.addEventListener("change", event => { state.selected = event.target.checked ? new Set(state.rows.map(row => String(row["记录ID"]))) : new Set(); if (state.mode === "view") persistSelection(); render(); });
      root.querySelector("tbody")?.addEventListener("change", event => {
        const control = event.target;
        if (control.dataset.selectId) { control.checked ? state.selected.add(control.dataset.selectId) : state.selected.delete(control.dataset.selectId); if (state.mode === "view") persistSelection(); render(); return; }
        const row = Number(control.dataset.row), col = Number(control.dataset.col), field = control.dataset.field;
        if (!Number.isInteger(row) || !Number.isInteger(col) || !field) return;
        if (state.mode === "option-edit") {
          state.rows[row][field] = control.type === "checkbox" ? control.checked : control.value;
          markOptionDirty();
          return;
        }
        state.rows[row][field] = field === "时间" ? dateForStore(control.value) : control.value;
        normaliseRow(state.rows[row], field);
        updateActive(row, col);
        syncDraftRows();
        if (field === "时间") {
          state.rows = filterDraftRows(
            [...state.draftRows.values()].map(item => JSON.parse(JSON.stringify(item)))
          );
          state.active = null; state.anchor = null; state.range = null;
        }
        if (["时间", "收支", "分类", "报销状态"].includes(field)) render();
      });
      root.querySelector("tbody")?.addEventListener("input", event => {
        const control = event.target, row = Number(control.dataset.row), field = control.dataset.field;
        if (state.mode === "option-edit" && Number.isInteger(row) && field) {
          state.rows[row][field] = control.value;
          markOptionDirty();
          return;
        }
        if (state.mode === "edit" && Number.isInteger(row) && field) { state.rows[row][field] = field === "时间" ? dateForStore(control.value) : control.value; syncDraftRows(); }
      });
      root.querySelector("tbody")?.addEventListener("click", event => {
        const td = event.target.closest("td[data-row]"); if (!td) return;
        if (state.mode === "option-edit" && event.target.matches("input,select")) return;
        if (state.mode === "edit" && event.target.matches("input,select")) {
          updateActive(Number(td.dataset.row), Number(td.dataset.col), event.shiftKey);
          root.querySelector("td.focused")?.classList.remove("focused");
          td.classList.add("focused");
          return;
        }
        activate(Number(td.dataset.row), Number(td.dataset.col), event.shiftKey);
      });
      root.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "c") {
          const target = event.target;
          const hasTextSelection = target.matches('input[type="text"], input[type="search"], input[type="url"], input[type="tel"], input[type="password"], textarea')
            && target.selectionStart !== target.selectionEnd;
          // 输入框内选中部分文本时，使用浏览器原生复制；未选中文字时仍复制当前单元格/区域。
          if (hasTextSelection) return;
          copyRange();
          return;
        }
        const isControl = ["INPUT", "SELECT"].includes(event.target.tagName);
        if (event.key === "Tab") {
          event.preventDefault();
          if (state.mode === "edit" && event.target.matches("input.datetime-text")) {
            const visibleMonth = String(state.args.visible_month || "");
            const row = state.rows[Number(event.target.dataset.row)];
            const rowMonth = String(row?.["时间"] || "").slice(0, 7);
            if (visibleMonth && rowMonth !== visibleMonth) {
              syncDraftRows();
              state.rows = filterDraftRows(
                [...state.draftRows.values()].map(item => JSON.parse(JSON.stringify(item)))
              );
              state.active = null; state.anchor = null; state.range = null;
              render();
              return;
            }
          }
          moveActive(0, event.shiftKey ? -1 : 1);
          return;
        }
        if (!isControl && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) { event.preventDefault(); moveActive(event.key === "ArrowUp" ? -1 : event.key === "ArrowDown" ? 1 : 0, event.key === "ArrowLeft" ? -1 : event.key === "ArrowRight" ? 1 : 0); }
      });
      root.addEventListener("paste", pasteAtActive);
    };
    window.addEventListener("storage", event => {
      if (event.key === state.selectionKey && state.mode === "actions") render();
      if (event.key === currentLayoutKey() && state.mode !== "actions") { state.layout = loadLayout(); render(); }
      if (event.key === DATE_MODE_KEY) { state.dateMode = loadDateMode(); render(); }
    });
    window.addEventListener("message", event => {
      const data = event.data; if (!data || data.type !== "streamlit:render") return;
      const args = data.args || {};
      const nextMode = args.mode || "view";
      const nextFilterResetKey = String(args.filter_reset_key || "");
      const nextDraftSessionId = String(args.draft_session_id || "");
      const sameDraftSession = nextMode === "edit" && state.draftSessionId === nextDraftSessionId;
      const inMemoryRows = sameDraftSession ? state.draftRows : new Map();
      const inMemoryDeletedIds = sameDraftSession ? state.deletedIds : new Set();
      state.args = args;
      state.mode = nextMode;
      if (state.filterResetKey !== nextFilterResetKey || !state.localFilters) {
        state.filterResetKey = nextFilterResetKey;
        state.localFilters = cloneFilters(args.filters || {});
        state.openFilter = null;
        state.filterDraft = null;
        state.filterError = "";
      }
      state.selectionKey = args.selection_key || "tx_selection";
      if (args.cleanup_draft_session_id) clearDraftState(String(args.cleanup_draft_session_id));
      if (args.cleanup_option_draft_id) clearOptionDraft(String(args.cleanup_option_draft_id));
      if (state.version !== args.version) {
        state.version = args.version; state.selected = new Set(); state.deletedIds = new Set(args.deleted_ids || []);
        if (state.mode === "edit") {
          const persisted = loadDraftState(nextDraftSessionId);
          state.draftSessionId = nextDraftSessionId;
          state.draftRows = new Map([...persisted.rows, ...inMemoryRows]);
          state.deletedIds = new Set([
            ...(args.deleted_ids || []).map(String),
            ...persisted.deletedIds,
            ...inMemoryDeletedIds,
          ]);
          (args.rows || []).forEach(row => {
            const transactionId = String(row["记录ID"]);
            if (!state.draftRows.has(transactionId)) state.draftRows.set(transactionId, JSON.parse(JSON.stringify(row)));
          });
          state.deletedIds.forEach(transactionId => state.draftRows.delete(String(transactionId)));
          state.rows = filterDraftRows(
            [...state.draftRows.values()].map(row => JSON.parse(JSON.stringify(row)))
          );
          saveDraftState();
        } else if (state.mode === "option-edit") {
          const optionDraftId = String(args.option_draft_id || "");
          const persisted = loadOptionDraft(optionDraftId);
          state.optionDraftId = optionDraftId;
          state.optionDirty = persisted.dirty;
          state.optionDirtyReported = false;
          state.rows = persisted.rows.length
            ? JSON.parse(JSON.stringify(persisted.rows))
            : JSON.parse(JSON.stringify(args.rows || []));
          const appendRow = args.option_append_row || {};
          if (appendRow.__行ID && !state.rows.some(row => row.__行ID === appendRow.__行ID)) {
            state.rows.push(JSON.parse(JSON.stringify(appendRow)));
            state.optionDirty = true;
            saveOptionDraft();
          }
        } else {
          // 只读表格、操作栏和年度汇总表不得读取或清除整表编辑草稿。
          state.draftRows = new Map(); state.draftSessionId = ""; state.deletedIds = new Set();
          state.rows = state.mode === "view"
            ? filterDraftRows(JSON.parse(JSON.stringify(args.rows || [])))
            : JSON.parse(JSON.stringify(args.rows || []));
        }
        state.active = null; state.anchor = null; state.range = null; state.confirmingDelete = false; state.confirmingOptionSave = false; state.batchEditing = false; state.batchValues = null;
        if (args.mode === "view") persistSelection();
      } else if (state.mode === "edit") {
        // 同一个编辑组件实例在筛选重跑后继续使用内存中的完整草稿。
        state.rows = filterDraftRows(
          [...state.draftRows.values()].map(row => JSON.parse(JSON.stringify(row)))
        );
      } else if (state.mode === "option-edit") {
        const optionDraftId = String(args.option_draft_id || "");
        if (state.optionDraftId !== optionDraftId) {
          const persisted = loadOptionDraft(optionDraftId);
          state.optionDraftId = optionDraftId;
          state.optionDirty = persisted.dirty;
          state.optionDirtyReported = false;
          state.rows = persisted.rows.length
            ? JSON.parse(JSON.stringify(persisted.rows))
            : JSON.parse(JSON.stringify(args.rows || []));
        }
        const appendRow = args.option_append_row || {};
        if (appendRow.__行ID && !state.rows.some(row => row.__行ID === appendRow.__行ID)) {
          state.rows.push(JSON.parse(JSON.stringify(appendRow)));
          state.optionDirty = true;
          saveOptionDraft();
        }
      } else {
        state.rows = state.mode === "view"
          ? filterDraftRows(JSON.parse(JSON.stringify(args.rows || [])))
          : JSON.parse(JSON.stringify(args.rows || []));
      }
      const signature = layoutSignature();
      if (state.layoutSignature !== signature) { state.layout = loadLayout(); state.layoutSignature = signature; }
      state.dateMode = state.dateMode || loadDateMode(); render();
      if (state.mode === "option-edit" && state.optionDirty && !state.optionDirtyReported) {
        state.optionDirtyReported = true;
        setTimeout(() => setValue({ action: "option_dirty" }), 0);
      }
      const optionSubmitToken = String(args.option_submit_token || "");
      if (state.mode === "option-edit" && optionSubmitToken && optionSubmitToken !== state.lastOptionSubmitToken) {
        state.lastOptionSubmitToken = optionSubmitToken;
        setTimeout(() => {
          if (state.rows.some(row => row["删除"])) {
            state.confirmingOptionSave = true;
            render();
          } else {
            saveOptionDraft();
            setValue({ action: "save", rows: state.rows });
          }
        }, 0);
      }
    });
    message("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
